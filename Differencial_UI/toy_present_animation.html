<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Toy PRESENT — Differential Cryptanalysis Animation</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0a0e1a; color: #e0e6ff; font-family: 'Courier New', monospace; min-height: 100vh; padding: 20px; }
h1 { text-align: center; color: #00e5ff; font-size: 1.4em; margin-bottom: 6px; text-shadow: 0 0 20px #00e5ff88; }
.subtitle { text-align: center; color: #7986cb; font-size: 0.85em; margin-bottom: 20px; }

/* Layout */
.cipher-grid {
  display: grid;
  grid-template-columns: 1fr 180px 1fr;
  gap: 0 10px;
  max-width: 900px;
  margin: 0 auto 24px;
}

.label-row { display: contents; }
.col-hdr { text-align: center; padding: 6px; font-size: 0.9em; font-weight: bold; border-radius: 6px; }
.hdr-p1 { background: #0d3358; color: #00b8ff; border: 1px solid #00b8ff55; }
.hdr-diff { background: #1a1230; color: #ffd600; border: 1px solid #ffd60055; }
.hdr-p2 { background: #3a0d2e; color: #ff4081; border: 1px solid #ff408155; }

/* State boxes */
.state-row { display: contents; }
.state-box {
  margin: 4px 0; padding: 8px 12px; border-radius: 8px; font-size: 0.82em;
  text-align: center; transition: all 0.5s ease; opacity: 0; transform: translateY(10px);
}
.state-box.visible { opacity: 1; transform: translateY(0); }
.box-p1 { background: #0d2a40; border: 1px solid #00b8ff; color: #00e5ff; }
.box-p2 { background: #2a0d1e; border: 1px solid #ff4081; color: #ff80ab; }
.box-diff { background: #1a1230; border: 1px solid #ffd600; color: #ffd600; text-align: center; }

/* Operation blocks */
.op-block { margin: 2px 0; padding: 5px; border-radius: 6px; text-align: center; font-size: 0.78em; font-weight: bold; opacity: 0; transition: all 0.4s ease; }
.op-block.visible { opacity: 1; }
.op-addkey { background: #102820; border: 1px solid #00c853; color: #69f0ae; }
.op-sbox   { background: #201020; border: 1px solid #e040fb; color: #ea80fc; }
.op-perm   { background: #102020; border: 1px solid #00bcd4; color: #80deea; }
.op-center { background: transparent; display: flex; align-items: center; justify-content: center; font-size: 1.1em; }

/* Nibble visualizer */
.nibbles { display: flex; gap: 4px; justify-content: center; margin: 2px 0; }
.nib {
  width: 36px; height: 28px; border-radius: 5px; display: flex; align-items: center; justify-content: center;
  font-size: 0.85em; font-weight: bold; transition: all 0.6s ease; border: 1px solid #333;
}
.nib.active-diff { background: #ff6f00 !important; border-color: #ff9800 !important; color: #fff !important; box-shadow: 0 0 10px #ff980088; animation: pulse 1s infinite; }
.nib.zero { background: #1a1a2e; color: #444; }
.nib.nonzero { background: #1e3a5f; color: #00e5ff; border-color: #00b8ff; }
.nib.p2color { background: #3a1229; color: #ff80ab; border-color: #ff4081; }

@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }

/* Attack section */
.attack-section {
  max-width: 900px; margin: 0 auto 24px; background: #0d1a0d; border: 1px solid #00c85355;
  border-radius: 12px; padding: 16px;
}
.attack-title { color: #69f0ae; font-size: 1em; margin-bottom: 12px; text-align: center; }
.guess-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.guess-card {
  background: #121212; border: 1px solid #333; border-radius: 8px; padding: 8px; text-align: center;
  font-size: 0.78em; transition: all 0.5s ease; opacity: 0;
}
.guess-card.visible { opacity: 1; }
.guess-card.winner { background: #0d2a0d; border-color: #00e676; box-shadow: 0 0 16px #00e67666; }
.guess-card.loser  { background: #1a0a0a; border-color: #d32f2f; opacity: 0.5; }
.guess-key { color: #b39ddb; font-size: 0.9em; }
.guess-score { font-size: 1.1em; font-weight: bold; }
.score-bar { height: 6px; background: #333; border-radius: 3px; margin-top: 4px; overflow: hidden; }
.score-fill { height: 100%; border-radius: 3px; transition: width 1s ease; }

/* Controls */
.controls { text-align: center; margin-bottom: 18px; }
button {
  background: #1a237e; border: 1px solid #3949ab; color: #9fa8da; padding: 8px 20px; border-radius: 6px;
  cursor: pointer; font-family: monospace; font-size: 0.9em; margin: 4px; transition: all 0.2s;
}
button:hover { background: #283593; color: #fff; border-color: #5c6bc0; }
button.active-btn { background: #00695c; border-color: #00bfa5; color: #a7ffeb; }

/* Round Selection */
.round-select { text-align: center; margin-bottom: 15px; }
.round-select button { background: #37474f; border-color: #263238; color: #eceff1; }
.round-select button.active-btn { background: #ff6f00; border-color: #ff8f00; color: #fff; box-shadow: 0 0 8px #ff8f0088; }

/* Explanation panel */
.explain {
  max-width: 900px; margin: 0 auto 16px; background: #0d1525; border-left: 3px solid #00b8ff;
  border-radius: 0 8px 8px 0; padding: 12px 16px; font-size: 0.85em; line-height: 1.7; min-height: 56px; transition: all 0.4s;
}
.explain .step-num { color: #ffd600; font-weight: bold; }
.explain .key-val  { color: #ff80ab; font-weight: bold; }
.explain .diff-val { color: #ff9800; font-weight: bold; }
.explain .ok-val   { color: #69f0ae; font-weight: bold; }
</style>
</head>
<body>

<h1>🔐 Toy PRESENT — Differential Cryptanalysis</h1>
<p class="subtitle">16-bit block · 20-bit key · Same S-box as real PRESENT</p>

<div class="round-select">
  <b>Select Target Rounds: </b>
  <button onclick="setRounds(2)" id="r2" class="active-btn">2 Rounds</button>
  <button onclick="setRounds(3)" id="r3">3 Rounds</button>
  <button onclick="setRounds(4)" id="r4">4 Rounds</button>
</div>

<div class="controls">
  <button onclick="startAnim()" id="startBtn">▶ Start Animation</button>
  <button onclick="resetAnim()">↺ Reset</button>
  <button onclick="setSpeed(1)" id="s1">Speed 1×</button>
  <button onclick="setSpeed(2)" id="s2">Speed 2×</button>
</div>

<div class="explain" id="explainBox">
  Select the number of rounds to attack and press <b>▶ Start Animation</b>.
</div>

<div class="cipher-grid" id="cipherGrid">
  <div class="col-hdr hdr-p1">P1 Path</div>
  <div class="col-hdr hdr-diff">XOR Difference (Δ)</div>
  <div class="col-hdr hdr-p2">P2 Path</div>
</div>

<div class="attack-section" id="attackSection" style="display:none">
  <div class="attack-title" id="attackTitle">🎯 Key Recovery</div>
  <div class="guess-grid" id="guessGrid"></div>
</div>

<script>
// ── Core Cryptography ──────────────────────────────────────────
const SBOX     = [0xC,0x5,0x6,0xB,0x9,0x0,0xA,0xD,0x3,0xE,0xF,0x8,0x4,0x7,0x1,0x2];
const SBOX_INV = SBOX.map((_,i,a)=>a.indexOf(i));
const PERM_16  = Array.from({length:16},(_,i)=>4*(i%4)+Math.floor(i/4));

function applySbox(s){ let o=0; for(let i=0;i<4;i++) o|=SBOX[(s>>(i*4))&0xF]<<(i*4); return o&0xFFFF; }
function applyPerm(s){ let o=0; for(let i=0;i<16;i++) o|=((s>>i)&1)<<PERM_16[i]; return o&0xFFFF; }
function keyschedule(k){
  const sks=[]; k&=0xFFFFF;
  for(let i=0;i<9;i++){
    sks.push(k>>4); k=((k<<1)|(k>>19))&0xFFFFF; k=(k&0x0FFFF)|(SBOX[(k>>16)&0xF]<<16);
  }
  return sks;
}
function encrypt(pt,sks,rounds){
  let s=pt&0xFFFF;
  for(let i=0;i<rounds-1;i++){ s^=sks[i]; s=applySbox(s); s=applyPerm(s); }
  s^=sks[rounds-1]; s=applySbox(s); s^=sks[rounds];
  return s&0xFFFF;
}
function fmtState(v){ return '0x'+v.toString(16).toUpperCase().padStart(4,'0'); }
function nibbles(v){ return [3,2,1,0].map(i=>((v>>(i*4))&0xF)); }

// DDT & Trail generation
const DDT = Array(16).fill(0).map(()=>Array(16).fill(0));
for(let din=1; din<16; din++) {
  for(let x=0; x<16; x++) DDT[din][SBOX[x]^SBOX[x^din]]++;
}
function bestDdtOutput(din) {
  let best=1, max=0;
  for(let d=1; d<16; d++) if(DDT[din][d]>max) { max=DDT[din][d]; best=d; }
  return best;
}
function buildTrail(rounds) {
  let delta = applyPerm(0x3000); // delta after R1 SBox (0x1000 -> 0x3000)
  let prob = 4/16;
  let layerProbs = [prob];
  for(let r=0; r<rounds-2; r++) {
    let nextDelta = 0;
    let lProb = 1.0;
    for(let i=0; i<4; i++) {
      let din = (delta >> (4*(3-i))) & 0xF;
      if(din) {
        let dout = bestDdtOutput(din);
        nextDelta |= dout << (4*(3-i));
        lProb *= (DDT[din][dout] / 16);
      }
    }
    delta = applyPerm(nextDelta);
    prob *= lProb;
    layerProbs.push(lProb);
  }
  let active = [];
  for(let i=0; i<4; i++) if((delta >> (4*(3-i))) & 0xF) active.push(i);
  return { deltaMid: delta, activeNibs: active, prob: prob, layerProbs: layerProbs };
}

// ── State variables ───────────────────────────────────────────
const KEY = 0xABCDE;
const SKS = keyschedule(KEY);
const DELTA_IN = 0x1000;

let targetRounds = 2;
let statesList = [];
let stepExplanations = [];
let stepIds = [];
let expectedDiff = 0;
let targetNibble = 0;

let animTimer=null, step=0, speedMs=900;

function setSpeed(n){ speedMs=900/n; ['s1','s2'].forEach(id=>document.getElementById(id).classList.remove('active-btn')); document.getElementById('s'+n).classList.add('active-btn'); }
function setRounds(r){
  targetRounds = r;
  [2,3,4].forEach(id=>document.getElementById('r'+id).classList.remove('active-btn'));
  document.getElementById('r'+r).classList.add('active-btn');
  resetAnim();
}

// ── Data Generation ───────────────────────────────────────────
function prepareData() {
  statesList = []; stepExplanations = []; stepIds = [];
  
  // Get trail info
  const trail = buildTrail(targetRounds);
  targetNibble = trail.activeNibs[0];
  expectedDiff = (trail.deltaMid >> (4*(3-targetNibble))) & 0xF;

  // Search for a P1 that perfectly follows the expected trail for visualization
  let p1_good = 0;
  for(let p = 0; p <= 0xFFFF; p++) {
      let c1 = p, c2 = p ^ DELTA_IN, ok = true, expectedDelta = DELTA_IN;
      for(let r=0; r<targetRounds-1; r++) {
          let sb1 = applySbox(c1^SKS[r]), sb2 = applySbox(c2^SKS[r]);
          let actualDeltaSb = sb1^sb2, expectedDeltaSb = 0;
          for(let i=0; i<4; i++) {
              let din = (expectedDelta >> (4*(3-i))) & 0xF;
              if(din) expectedDeltaSb |= bestDdtOutput(din) << (4*(3-i));
          }
          if(actualDeltaSb !== expectedDeltaSb) { ok = false; break; }
          expectedDelta = applyPerm(expectedDeltaSb);
          c1 = applyPerm(sb1); c2 = applyPerm(sb2);
      }
      if(ok) { p1_good = p; break; }
  }

  let p1 = p1_good, p2 = p1 ^ DELTA_IN;
  let runningProb = 1.0;

  statesList.push({ id:'init', label:null, p1:p1, p2:p2, d:p1^p2, dlabel:`Δ = P1 ⊕ P2<br><span style="color:#69f0ae">Prob: 100%</span>` });
  stepExplanations.push(`<span class="step-num">Step 0 — Chosen Plaintexts</span><br>We choose P1=${fmtState(p1)} so it follows the trail, and set P2 = P1 ⊕ 0x1000. Input difference Δ is <b>0x1000</b>.`);
  stepIds.push(['sb1_init', 'sbd_init', 'sb2_init']);
  
  let stepIdx = 1;
  for(let r=0; r<targetRounds-1; r++) {
    // AddKey
    let ak1 = p1^SKS[r], ak2 = p2^SKS[r];
    statesList.push({ id:`r${r}ak`, label:`AddKey (SK${r})`, p1:ak1, p2:ak2, d:ak1^ak2, dlabel:`Δ unchanged<br><span style="color:#69f0ae">Prob: ${(runningProb*100).toFixed(4)}%</span>` });
    stepExplanations.push(`<span class="step-num">Step ${stepIdx++} — Round ${r+1}: AddKey</span><br>XORing the key doesn't change the difference. Linear operations have 100% probability.`);
    stepIds.push([`r${r}ak_op_L`,`r${r}ak_op_C`,`r${r}ak_op_R`, `sb1_r${r}ak`,`sbd_r${r}ak`,`sb2_r${r}ak`]);

    // SBox
    let sb1 = applySbox(ak1), sb2 = applySbox(ak2);
    let lProb = trail.layerProbs[r];
    runningProb *= lProb;
    statesList.push({ id:`r${r}sb`, label:`S-Box`, p1:sb1, p2:sb2, d:sb1^sb2, dlabel:`Δ changes<br><span style="color:#ffb74d">Prob drops to: ${(runningProb*100).toFixed(4)}%</span>` });
    stepExplanations.push(`<span class="step-num">Step ${stepIdx++} — Round ${r+1}: S-Box</span><br>S-Box alters the difference based on the DDT. Probability for this transition is <b>${(lProb*100).toFixed(2)}%</b>.<br>Cumulative trail probability drops to: <span class="diff-val">${(runningProb*100).toFixed(4)}%</span>.`);
    stepIds.push([`r${r}sb_op_L`,`r${r}sb_op_C`,`r${r}sb_op_R`, `sb1_r${r}sb`,`sbd_r${r}sb`,`sb2_r${r}sb`]);

    // Permutation
    let pm1 = applyPerm(sb1), pm2 = applyPerm(sb2);
    statesList.push({ id:`r${r}pm`, label:`P-Layer`, p1:pm1, p2:pm2, d:pm1^pm2, dlabel:`Δ spread<br><span style="color:#69f0ae">Prob: ${(runningProb*100).toFixed(4)}%</span>` });
    stepExplanations.push(`<span class="step-num">Step ${stepIdx++} — Round ${r+1}: P-Layer</span><br>The permutation scatters the active difference bits to new nibbles. Linear operations have 100% probability.`);
    stepIds.push([`r${r}pm_op_L`,`r${r}pm_op_C`,`r${r}pm_op_R`, `sb1_r${r}pm`,`sbd_r${r}pm`,`sb2_r${r}pm`]);

    p1 = pm1; p2 = pm2;
  }

  // Last Round (No Permutation)
  let lr = targetRounds - 1;
  let ak1 = p1^SKS[lr], ak2 = p2^SKS[lr];
  statesList.push({ id:`rl_ak`, label:`AddKey (SK${lr})`, p1:ak1, p2:ak2, d:ak1^ak2, dlabel:`Δ unchanged<br><span style="color:#69f0ae">Prob: ${(runningProb*100).toFixed(4)}%</span>` });
  stepExplanations.push(`<span class="step-num">Step ${stepIdx++} — Round ${targetRounds}: AddKey</span><br>The difference entering the final S-Box is preserved.`);
  stepIds.push([`rl_ak_op_L`,`rl_ak_op_C`,`rl_ak_op_R`, `sb1_rl_ak`,`sbd_rl_ak`,`sb2_rl_ak`]);

  let sb1 = applySbox(ak1), sb2 = applySbox(ak2);
  statesList.push({ id:`rl_sb`, label:`S-Box (Target)`, p1:sb1, p2:sb2, d:sb1^sb2, dlabel:`Target S-Box Output<br><span style="color:#9e9e9e">(No prob needed)</span>` });
  stepExplanations.push(`<span class="step-num">Step ${stepIdx++} — Round ${targetRounds}: S-Box (Attack Target)</span><br>This is the S-Box we will attack. We do NOT calculate probability for this step because the attack works backward from the ciphertext!`);
  stepIds.push([`rl_sb_op_L`,`rl_sb_op_C`,`rl_sb_op_R`, `sb1_rl_sb`,`sbd_rl_sb`,`sb2_rl_sb`]);

  // Final AddKey
  let out1 = sb1^SKS[targetRounds], out2 = sb2^SKS[targetRounds];
  statesList.push({ id:`out`, label:`Final AddKey (SK${targetRounds})`, p1:out1, p2:out2, d:out1^out2, dlabel:'Ciphertext ΔC' });
  stepExplanations.push(`<span class="step-num">Step ${stepIdx++} — Final AddKey</span><br>C1 and C2 are captured. Now we can launch the differential key recovery attack.`);
  stepIds.push([`out_op_L`,`out_op_C`,`out_op_R`, `sb1_out`,`sbd_out`,`sb2_out`]);

  const numPairs = targetRounds === 2 ? 500 : (targetRounds === 3 ? 2000 : 15000);
  stepExplanations.push(`<span class="step-num">Step ${stepIdx} — Key Recovery Attack</span><br>Guessing <b>Nibble ${targetNibble}</b> of Subkey ${targetRounds}. Looking for expected difference <span class="diff-val">0x${expectedDiff.toString(16).toUpperCase()}</span>.<br>Using ${numPairs} pairs for a trail probability of ${(runningProb*100).toFixed(4)}%.`);
  stepIds.push([]);
}

// ── DOM Construction ──────────────────────────────────────────
function buildGrid() {
  prepareData();
  const g = document.getElementById('cipherGrid');
  while(g.children.length>3) g.removeChild(g.lastChild);

  statesList.forEach(r => {
    if(r.label) {
      const cls = r.label.includes('AddKey')?'op-addkey':r.label.includes('S-Box')?'op-sbox':'op-perm';
      g.innerHTML+=`<div class="op-block ${cls}" id="${r.id}_op_L">${r.label}</div><div class="op-block op-center" id="${r.id}_op_C">⬇</div><div class="op-block ${cls}" id="${r.id}_op_R">${r.label}</div>`;
    }
    const nibs1=nibbles(r.p1), nibs2=nibbles(r.p2), nibsd=nibbles(r.d);
    const n1h = nibs1.map((n,i)=>`<div class="nib ${nibsd[i]?'nonzero':'zero'}" id="n1_${r.id}_${i}">${n.toString(16).toUpperCase()}</div>`).join('');
    const n2h = nibs2.map((n,i)=>`<div class="nib ${nibsd[i]?'p2color':'zero'}" id="n2_${r.id}_${i}">${n.toString(16).toUpperCase()}</div>`).join('');
    const ndh = nibsd.map((n,i)=>`<div class="nib ${n?'active-diff':'zero'}" id="nd_${r.id}_${i}">${n?n.toString(16).toUpperCase():'0'}</div>`).join('');
    
    g.innerHTML+=`
      <div class="state-box box-p1" id="sb1_${r.id}">${fmtState(r.p1)}<div class="nibbles">${n1h}</div></div>
      <div class="state-box box-diff" id="sbd_${r.id}">${fmtState(r.d)}<br><span style="font-size:0.7em;color:#9e9e9e">${r.dlabel}</span><div class="nibbles">${ndh}</div></div>
      <div class="state-box box-p2" id="sb2_${r.id}">${fmtState(r.p2)}<div class="nibbles">${n2h}</div></div>`;
  });
}

function buildAttack() {
  const sec = document.getElementById('attackSection');
  sec.style.display = 'block';
  document.getElementById('attackTitle').innerHTML = `🎯 Key Recovery: Guessing SK${targetRounds} (Nibble ${targetNibble})`;
  const grid = document.getElementById('guessGrid');
  grid.innerHTML = '';

  const correctKey = ((SKS[targetRounds]) >> (4*(3-targetNibble))) & 0xF;
  const numPairs = targetRounds === 2 ? 500 : (targetRounds === 3 ? 2000 : 15000);
  const scores = Array(16).fill(0);

  for(let t=0; t<numPairs; t++) {
    const p = Math.floor(Math.random()*0x10000);
    const c1 = encrypt(p, SKS, targetRounds);
    const c2 = encrypt(p^DELTA_IN, SKS, targetRounds);
    const n1 = (c1 >> (4*(3-targetNibble))) & 0xF;
    const n2 = (c2 >> (4*(3-targetNibble))) & 0xF;
    for(let g=0; g<16; g++) {
      if((SBOX_INV[n1^g] ^ SBOX_INV[n2^g]) === expectedDiff) scores[g]++;
    }
  }
  const maxScore = Math.max(...scores);

  for(let g=0; g<16; g++) {
    const isCorrect = g === correctKey;
    const pct = Math.round(scores[g]/maxScore*100);
    const barColor = isCorrect ? '#00e676' : '#e53935';
    const card = document.createElement('div');
    card.className = 'guess-card';
    card.id = 'guess_'+g;
    card.innerHTML = `
      <div class="guess-key">Key=0x${g.toString(16).toUpperCase()}</div>
      <div class="guess-score" style="color:${isCorrect?'#69f0ae':'#ef9a9a'}">${scores[g]}</div>
      <div class="score-bar"><div class="score-fill" id="bar_${g}" style="width:0%;background:${barColor}"></div></div>
      ${isCorrect?'<div style="color:#00e676;font-size:0.7em;margin-top:3px">✅ CORRECT KEY</div>':''}`;
    grid.appendChild(card);

    setTimeout(() => {
      card.classList.add('visible');
      card.classList.add(isCorrect ? 'winner' : 'loser');
      setTimeout(() => { document.getElementById('bar_'+g).style.width = pct+'%'; }, 200);
    }, g*80);
  }
}

// ── Animation Loop ────────────────────────────────────────────
function showExplain(idx) { document.getElementById('explainBox').innerHTML = stepExplanations[idx] || ''; }
function revealIds(ids) { ids.forEach(id => { const el=document.getElementById(id); if(el) el.classList.add('visible'); }); }

function animStep() {
  if(step >= stepIds.length) {
    buildAttack();
    showExplain(stepExplanations.length - 1);
    return;
  }
  showExplain(step);
  revealIds(stepIds[step]);
  step++;
  animTimer = setTimeout(animStep, speedMs);
}

function startAnim() {
  if(animTimer) return;
  document.getElementById('startBtn').textContent = '▶ Running...';
  animStep();
}

function resetAnim() {
  clearTimeout(animTimer); animTimer = null; step = 0;
  document.getElementById('startBtn').textContent = '▶ Start Animation';
  document.getElementById('explainBox').innerHTML = 'Select target rounds and press <b>▶ Start Animation</b>.';
  document.getElementById('attackSection').style.display = 'none';
  buildGrid();
}

// ── Init ──────────────────────────────────────────────────────
window.onload = function() { buildGrid(); setSpeed(1); };
</script>
</body>
</html>
